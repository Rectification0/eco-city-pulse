[tool.pytest.ini_options]
# rootdir is backend/, so `pytest` from here resolves `main`, `core`, `api`
# the same way uvicorn does in the container.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "db: needs a reachable PostgreSQL; skipped automatically when none answers",
]
filterwarnings = ["error::DeprecationWarning:api.*", "error::DeprecationWarning:core.*"]
