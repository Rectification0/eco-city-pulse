# Alembic configuration (task 1.6).
#
# Note what is NOT here: sqlalchemy.url. The connection string is assembled in
# core/config.py from environment variables and read by db/migrations/env.py,
# so no credential ever lands in a committed file (SEC-2).

[alembic]
script_location = db/migrations
prepend_sys_path = .
path_separator = os

# Timestamped revision files sort chronologically in a directory listing, which
# a bare hash does not.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
